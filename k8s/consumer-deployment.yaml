apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-minio-consumer
  namespace: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-minio-consumer
  template:
    metadata:
      labels:
        app: kafka-minio-consumer
    spec:
      containers:
        - name: consumer
          image: kafka-minio-consumer:local
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: events
            - name: MINIO_ENDPOINT
              value: http://minio.consumer.svc.cluster.local:9000
            - name: MINIO_ACCESS_KEY
              value: minio
            - name: MINIO_SECRET_KEY
              value: minio12345
            - name: MINIO_BUCKET
              value: kafka-sink
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"